processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

gradlePlugin {
    testSourceSets sourceSets.functionalTest
    website = 'http://cjstehno.github.io/dependency-checker/'
    vcsUrl = 'https://github.com/cjstehno/dependency-checker'
    // Define the plugin
    plugins {
        register('dependencyCheckerPlugin') {
            id = 'com.stehno.gradle.dependency-checker'
            implementationClass = 'com.stehno.gradle.dependency-checker.DependencyCheckerPlugin'
            displayName = 'Gradle Dependency Checker Plugin'
            description = 'Gradle plugin to aid in managing dependencies.'
            tags = ['gradle', 'groovy']
        }
    }
}

publishing {
    repositories {
        maven {
            name = 'localRepo'
            url = layout.buildDirectory.dir('local-repo').get().asFile.toURI()
        }
    }
}
